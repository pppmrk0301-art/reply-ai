<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SellerReply AI</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background: #1e293b;
      padding: 25px;
      border-radius: 14px;
      width: 540px;
      box-shadow: 0 0 25px rgba(0,0,0,0.35);
    }

    h1 {
      margin-top: 0;
      font-size: 22px;
    }

    .subtitle {
      font-size: 13px;
      opacity: 0.75;
      margin-bottom: 18px;
    }

    textarea {
      width: 100%;
      height: 120px;
      border-radius: 10px;
      border: none;
      padding: 12px;
      margin-bottom: 15px;
      resize: none;
      font-size: 14px;
      box-sizing: border-box;
    }

    .templates {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }

    .templates button {
      background: #334155;
      border: none;
      padding: 7px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      color: white;
    }

    .templates button:hover {
      background: #475569;
    }

    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    select {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: none;
    }

    .main-btn {
      background: #3b82f6;
      border: none;
      padding: 12px;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }

    .main-btn:hover {
      background: #2563eb;
    }

    .output {
      margin-top: 15px;
      background: #020617;
      padding: 15px;
      border-radius: 10px;
      white-space: pre-line;
      min-height: 70px;
      line-height: 1.45;
    }

    .copy-btn {
      margin-top: 10px;
      background: #22c55e;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }

    .copy-btn:hover {
      background: #16a34a;
    }

    .pro-btn {
      margin-top: 12px;
      background: #f59e0b;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }

    .pro-btn:hover {
      background: #d97706;
    }

    .usage {
      margin-top: 12px;
      font-size: 12px;
      opacity: 0.75;
      text-align: center;
    }

    .paywall {
      margin-top: 15px;
      background: #451a03;
      border: 1px solid #f59e0b;
      padding: 14px;
      border-radius: 10px;
      display: none;
      font-size: 14px;
      line-height: 1.4;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Stop wasting hours answering buyers.</h1>

  <div class="subtitle">
    Copy → click → send. Answer any Vinted / Leboncoin message instantly.
  </div>

  <textarea id="message" placeholder="Paste buyer message here..."></textarea>

  <div class="templates">
    <button onclick="setTemplate('delivery')">📦 Delivery delay</button>
    <button onclick="setTemplate('refund')">💸 Refund</button>
    <button onclick="setTemplate('price')">💰 Price negotiation</button>
    <button onclick="setTemplate('available')">❓ Still available?</button>
    <button onclick="setTemplate('refuse')">🚫 Refuse offer</button>
  </div>

  <div class="row">
    <select id="language">
      <option value="en">English</option>
      <option value="fr">Français</option>
    </select>

    <select id="tone">
      <option value="balanced">Balanced</option>
      <option value="friendly">Friendly</option>
      <option value="formal">Professional</option>
      <option value="firm">Firm</option>
    </select>

    <select id="length">
      <option value="short">Short</option>
      <option value="medium">Medium</option>
      <option value="long">Long</option>
    </select>
  </div>

  <button class="main-btn" onclick="generate()">Generate reply</button>

  <div class="usage" id="usageText"></div>

  <div class="paywall" id="paywallBox">
    Free limit reached. Upgrade to PRO for unlimited replies.
  </div>

  <div class="output" id="output">Your reply will appear here.</div>

  <button class="copy-btn" onclick="copyText()">Copy reply</button>

  <button class="pro-btn" onclick="unlockPro()">🔥 Unlock PRO</button>

</div>

<script>
const STRIPE_PAYMENT_LINK = "https://buy.stripe.com/4gM7sKblZ7j0ckO6cpcwg00";
const FREE_LIMIT = 3;

const templates = {
  delivery: {
    en: "Hi, I still haven’t received my order. Can you check the delivery status?",
    fr: "Bonjour, je n’ai toujours pas reçu ma commande. Pouvez-vous vérifier la livraison ?"
  },
  refund: {
    en: "Hi, I would like a refund. What is the process?",
    fr: "Bonjour, je souhaite un remboursement. Quelle est la procédure ?"
  },
  price: {
    en: "Hi, would you accept a lower price?",
    fr: "Bonjour, acceptez-vous un prix plus bas ?"
  },
  available: {
    en: "Hi, is this item still available?",
    fr: "Bonjour, cet article est-il toujours disponible ?"
  },
  refuse: {
    en: "Hi, I can’t accept that offer, thank you.",
    fr: "Bonjour, je ne peux pas accepter cette offre, merci."
  }
};

function getUsage() {
  return Number(localStorage.getItem("sellerreply_usage") || 0);
}

function setUsage(value) {
  localStorage.setItem("sellerreply_usage", value);
}

function updateUsageText() {
  const usage = getUsage();
  const remaining = Math.max(FREE_LIMIT - usage, 0);
  document.getElementById("usageText").innerText =
    `${remaining} free replies left`;
}

function showPaywall() {
  document.getElementById("paywallBox").style.display = "block";
  document.getElementById("output").innerText =
    "Free limit reached. Upgrade to PRO to keep generating replies.";
}

function setTemplate(type) {
  const lang = document.getElementById("language").value;
  document.getElementById("message").value = templates[type][lang];
}

async function generate() {
  const message = document.getElementById("message").value.trim();

  if (!message) {
    alert("Write something first");
    return;
  }

  const usage = getUsage();

  if (usage >= FREE_LIMIT) {
    showPaywall();
    return;
  }

  document.getElementById("output").innerText = "⏳ Generating...";

  try {
    const res = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message,
        language: document.getElementById("language").value,
        tone: document.getElementById("tone").value,
        length: document.getElementById("length").value
      })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || "API error");
    }

    setUsage(usage + 1);
    updateUsageText();

    document.getElementById("output").innerText = data.text;

  } catch {
    document.getElementById("output").innerText = "Error";
  }
}

function copyText() {
  const text = document.getElementById("output").innerText;

  if (!text || text.includes("Free limit reached") || text === "Your reply will appear here.") {
    alert("No reply to copy.");
    return;
  }

  navigator.clipboard.writeText(text);
  alert("Copied!");
}

function unlockPro() {
  window.location.href = STRIPE_PAYMENT_LINK;
}

updateUsageText();
</script>

</body>
</html>
