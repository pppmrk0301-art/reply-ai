<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>SellerReply AI</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
      width: 520px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    h2 {
      margin-top: 0;
    }

    textarea {
      width: 100%;
      height: 120px;
      border-radius: 8px;
      border: none;
      padding: 10px;
      margin-bottom: 15px;
      resize: none;
      font-size: 14px;
    }

    .templates {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }

    .templates button {
      background: #334155;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }

    .templates button:hover {
      background: #475569;
    }

    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    select {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      border: none;
    }

    .main-btn {
      background: #3b82f6;
      border: none;
      padding: 10px;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }

    .main-btn:hover {
      background: #2563eb;
    }

    .output {
      margin-top: 15px;
      background: #020617;
      padding: 15px;
      border-radius: 8px;
      white-space: pre-line;
    }

    .copy-btn {
      margin-top: 10px;
      background: #22c55e;
      border: none;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }

    .copy-btn:hover {
      background: #16a34a;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>SellerReply AI</h2>
  <p style="font-size:12px;opacity:0.7;">
    Réponds instantanément aux clients (Vinted, Leboncoin, Shopify…)
  </p>

  <textarea id="message" placeholder="Colle ici le message du client..."></textarea>

  <!-- 🔥 TEMPLATES -->
  <div class="templates">
    <button onclick="setTemplate('delivery')">📦 Retard livraison</button>
    <button onclick="setTemplate('refund')">💸 Remboursement</button>
    <button onclick="setTemplate('price')">💰 Négociation prix</button>
    <button onclick="setTemplate('available')">❓ Toujours dispo ?</button>
    <button onclick="setTemplate('refuse')">🚫 Refus poli</button>
  </div>

  <div class="row">
    <select id="language">
      <option value="fr">Français</option>
      <option value="en">English</option>
    </select>

    <select id="tone">
      <option value="balanced">Équilibré</option>
      <option value="friendly">Amical</option>
      <option value="formal">Professionnel</option>
      <option value="firm">Ferme</option>
    </select>

    <select id="length">
      <option value="short">Court</option>
      <option value="medium">Moyen</option>
      <option value="long">Long</option>
    </select>
  </div>

  <button class="main-btn" onclick="generate()">Générer réponse</button>

  <div class="output" id="output"></div>

  <button class="copy-btn" onclick="copyText()">📋 Copier la réponse</button>

</div>

<script>

function setTemplate(type) {
  const templates = {
    delivery: "Bonjour, je n’ai toujours pas reçu ma commande, pouvez-vous vérifier ?",
    refund: "Bonjour, je souhaite un remboursement, merci de m’indiquer la procédure.",
    price: "Bonjour, est-ce que vous acceptez un prix plus bas ?",
    available: "Bonjour, l’article est-il toujours disponible ?",
    refuse: "Bonjour, je ne peux pas accepter cette offre, merci de votre compréhension."
  };

  document.getElementById("message").value = templates[type];
}

async function generate() {
  const message = document.getElementById("message").value;
  const language = document.getElementById("language").value;
  const tone = document.getElementById("tone").value;
  const length = document.getElementById("length").value;

  if (!message) {
    alert("Écris quelque chose");
    return;
  }

  document.getElementById("output").innerText = "Chargement...";

  try {
    const res = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message,
        language,
        tone,
        length
      })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || "Erreur API");
    }

    document.getElementById("output").innerText = data.text;

  } catch (err) {
    document.getElementById("output").innerText =
      "Erreur de connexion au serveur.";
    console.error(err);
  }
}

function copyText() {
  const text = document.getElementById("output").innerText;
  navigator.clipboard.writeText(text);
  alert("Copié !");
}

</script>

</body>
</html>
