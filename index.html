<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ReplyAI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      width: 500px;
    }

    textarea {
      width: 100%;
      height: 100px;
      margin-bottom: 10px;
      border-radius: 8px;
      padding: 10px;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      cursor: pointer;
      margin-right: 5px;
    }

    .result {
      margin-top: 15px;
      white-space: pre-line;
      background: #020617;
      padding: 10px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>ReplyAI</h2>

  <textarea id="inputText" placeholder="Colle ton message ici..."></textarea>

  <button onclick="generate()">Generate Replies</button>

  <div class="result" id="output"></div>
</div>

<script>
async function generate() {
  const message = document.getElementById("inputText").value;

  if (!message) {
    alert("Écris quelque chose");
    return;
  }

  try {
    const res = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: message,
        language: "fr",
        tone: "balanced",
        length: "medium"
      })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || "Erreur serveur");
    }

    document.getElementById("output").innerText = data.text;

  } catch (err) {
    document.getElementById("output").innerText =
      "Erreur de connexion au serveur.";
    console.error(err);
  }
}
</script>

</body>
</html>
