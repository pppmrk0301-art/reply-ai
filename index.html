<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>SellerReply AI</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background: #1e293b;
      padding: 25px;
      border-radius: 14px;
      width: 540px;
      box-shadow: 0 0 25px rgba(0,0,0,0.35);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      opacity: 0.75;
      margin-bottom: 18px;
    }

    textarea {
      width: 100%;
      height: 125px;
      border-radius: 10px;
      border: none;
      padding: 12px;
      margin-bottom: 15px;
      resize: none;
      font-size: 14px;
      box-sizing: border-box;
    }

    .templates {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }

    .templates button {
      background: #334155;
      color: white;
      border: none;
      padding: 8px 11px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }

    .templates button:hover {
      background: #475569;
    }

    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    select {
      flex: 1;
      padding: 9px;
      border-radius: 8px;
      border: none;
    }

    .main-btn {
      background: #3b82f6;
      border: none;
      padding: 12px;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }

    .main-btn:hover {
      background: #2563eb;
    }

    .output {
      margin-top: 15px;
      background: #020617;
      padding: 15px;
      border-radius: 10px;
      white-space: pre-line;
      min-height: 70px;
      line-height: 1.45;
    }

    .copy-btn {
      margin-top: 10px;
      background: #22c55e;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }

    .copy-btn:hover {
      background: #16a34a;
    }

    .small-note {
      margin-top: 12px;
      font-size: 11px;
      opacity: 0.55;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>SellerReply AI</h2>
  <div class="subtitle">
    Réponses instantanées pour Vinted, Leboncoin, Shopify et petits vendeurs.
  </div>

  <textarea id="message" placeholder="Colle ici le message du client..."></textarea>

  <div class="templates">
    <button onclick="setTemplate('delivery')">📦 Retard livraison</button>
    <button onclick="setTemplate('refund')">💸 Remboursement</button>
    <button onclick="setTemplate('price')">💰 Négociation prix</button>
    <button onclick="setTemplate('available')">❓ Toujours dispo ?</button>
    <button onclick="setTemplate('refuse')">🚫 Refus poli</button>
  </div>

  <div class="row">
    <select id="language">
      <option value="fr">Français</option>
      <option value="en">English</option>
    </select>

    <select id="tone">
      <option value="balanced">Équilibré</option>
      <option value="friendly">Amical</option>
      <option value="formal">Professionnel</option>
      <option value="firm">Ferme</option>
    </select>

    <select id="length">
      <option value="short">Court</option>
      <option value="medium">Moyen</option>
      <option value="long">Long</option>
    </select>
  </div>

  <button class="main-btn" onclick="generate()">Générer réponse</button>

  <div class="output" id="output">Ta réponse apparaîtra ici.</div>

  <button class="copy-btn" onclick="copyText()">📋 Copier la réponse</button>

  <div class="small-note">
    Astuce : clique sur un modèle pour générer une réponse immédiatement.
  </div>

</div>

<script>
function setTemplate(type) {
  const templates = {
    delivery: "Bonjour, je n’ai toujours pas reçu ma commande. Pouvez-vous vérifier où en est la livraison ?",
    refund: "Bonjour, je souhaite demander un remboursement. Pouvez-vous m’indiquer la procédure à suivre ?",
    price: "Bonjour, est-ce que vous accepteriez un prix plus bas pour cet article ?",
    available: "Bonjour, l’article est-il toujours disponible ?",
    refuse: "Bonjour, merci pour votre proposition, mais je ne peux pas accepter cette offre."
  };

  document.getElementById("message").value = templates[type];
  generate();
}

async function generate() {
  const message = document.getElementById("message").value.trim();
  const language = document.getElementById("language").value;
  const tone = document.getElementById("tone").value;
  const length = document.getElementById("length").value;

  if (!message) {
    alert("Écris ou colle un message d’abord.");
    return;
  }

  document.getElementById("output").innerText = "⏳ Génération en cours...";

  try {
    const res = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message,
        language,
        tone,
        length
      })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || "Erreur API");
    }

    document.getElementById("output").innerText = data.text;

  } catch (err) {
    document.getElementById("output").innerText =
      "Erreur de connexion au serveur.";
    console.error(err);
  }
}

function copyText() {
  const text = document.getElementById("output").innerText;

  if (!text || text === "Ta réponse apparaîtra ici." || text === "⏳ Génération en cours...") {
    alert("Aucune réponse à copier.");
    return;
  }

  navigator.clipboard.writeText(text);
  alert("Réponse copiée !");
}
</script>

</body>
</html>
