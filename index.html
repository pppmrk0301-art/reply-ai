<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SellerReply AI</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background: #1e293b;
      padding: 25px;
      border-radius: 14px;
      width: 540px;
      box-shadow: 0 0 25px rgba(0,0,0,0.35);
    }

    h1 {
      margin-top: 0;
      font-size: 22px;
    }

    .subtitle {
      font-size: 13px;
      opacity: 0.75;
      margin-bottom: 18px;
    }

    textarea {
      width: 100%;
      height: 120px;
      border-radius: 10px;
      border: none;
      padding: 12px;
      margin-bottom: 15px;
      resize: none;
      font-size: 14px;
      box-sizing: border-box;
    }

    .templates {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }

    .templates button {
      background: #334155;
      border: none;
      padding: 7px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      color: white;
    }

    .templates button:hover {
      background: #475569;
    }

    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    select {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: none;
    }

    .main-btn {
      background: #3b82f6;
      border: none;
      padding: 12px;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }

    .main-btn:hover {
      background: #2563eb;
    }

    .output {
      margin-top: 15px;
      background: #020617;
      padding: 15px;
      border-radius: 10px;
      white-space: pre-line;
      min-height: 70px;
      line-height: 1.45;
    }

    .copy-btn {
      margin-top: 10px;
      background: #22c55e;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }

    .copy-btn:hover {
      background: #16a34a;
    }

    .pro-btn {
      margin-top: 12px;
      background: #f59e0b;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }

    .pro-btn:hover {
      background: #d97706;
    }

    .usage {
      margin-top: 12px;
      font-size: 12px;
      opacity: 0.75;
      text-align: center;
    }

    .paywall {
      margin-top: 15px;
      background: #451a03;
      border: 1px solid #f59e0b;
      padding: 14px;
      border-radius: 10px;
      display: none;
      font-size: 14px;
      line-height: 1.4;
    }
  </style>
</head>

<body>

<div class="container">

  <h1 id="headline">Stop wasting hours answering buyers.</h1>

  <div class="subtitle" id="subtitle">
    Copy → click → send. Answer any Vinted / Leboncoin message instantly.
  </div>

  <textarea id="message" placeholder="Paste buyer message here..."></textarea>

  <div class="templates">
    <button id="deliveryBtn" onclick="setTemplate('delivery')">📦 Delivery delay</button>
    <button id="refundBtn" onclick="setTemplate('refund')">💸 Refund</button>
    <button id="priceBtn" onclick="setTemplate('price')">💰 Price negotiation</button>
    <button id="availableBtn" onclick="setTemplate('available')">❓ Still available?</button>
    <button id="refuseBtn" onclick="setTemplate('refuse')">🚫 Refuse offer</button>
  </div>

  <div class="row">
    <select id="language" onchange="updateUI()">
      <option value="en">English</option>
      <option value="fr">Français</option>
    </select>

    <select id="tone"></select>
    <select id="length"></select>
  </div>

  <button class="main-btn" id="generateBtn" onclick="generate()">Generate reply</button>

  <div class="usage" id="usageText"></div>

  <div class="paywall" id="paywallBox">
    Free limit reached. Upgrade to PRO for unlimited replies.
  </div>

  <div class="output" id="output">Your reply will appear here.</div>

  <button class="copy-btn" id="copyBtn" onclick="copyText()">Copy reply</button>

  <button class="pro-btn" id="proBtn" onclick="unlockPro()">🔥 Unlock PRO</button>

</div>

<script>
const STRIPE_PAYMENT_LINK = "https://buy.stripe.com/4gM7sKblZ7j0ckO6cpcwg00";
const FREE_LIMIT = 3;

const uiText = {
  en: {
    headline: "Stop wasting hours answering buyers.",
    subtitle: "Copy → click → send. Answer any Vinted / Leboncoin message instantly.",
    placeholder: "Paste buyer message here...",
    generate: "Generate reply",
    copy: "Copy reply",
    pro: "🔥 Unlock PRO",
    outputDefault: "Your reply will appear here.",
    loading: "⏳ Generating...",
    emptyAlert: "Write a message first.",
    copiedAlert: "Copied!",
    noCopyAlert: "No reply to copy.",
    error: "Error",
    freeLeft: "free replies left",
    paywall: "Free limit reached. Upgrade to PRO for unlimited replies.",
    paywallOutput: "Free limit reached. Upgrade to PRO to keep generating replies.",
    tones: [
      ["balanced", "Balanced"],
      ["friendly", "Friendly"],
      ["formal", "Professional"],
      ["firm", "Firm"]
    ],
    lengths: [
      ["short", "Short"],
      ["medium", "Medium"],
      ["long", "Long"]
    ],
    buttons: {
      delivery: "📦 Delivery delay",
      refund: "💸 Refund",
      price: "💰 Price negotiation",
      available: "❓ Still available?",
      refuse: "🚫 Refuse offer"
    },
    templates: {
      delivery: "Hi, I still haven’t received my order. Can you check the delivery status?",
      refund: "Hi, I would like a refund. What is the process?",
      price: "Hi, would you accept a lower price?",
      available: "Hi, is this item still available?",
      refuse: "Hi, I can’t accept that offer, thank you."
    }
  },

  fr: {
    headline: "Arrête de perdre du temps à répondre aux acheteurs.",
    subtitle: "Copie → clique → envoie. Réponds aux messages Vinted / Leboncoin instantanément.",
    placeholder: "Colle ici le message de l’acheteur...",
    generate: "Générer réponse",
    copy: "Copier la réponse",
    pro: "🔥 Débloquer PRO",
    outputDefault: "Ta réponse apparaîtra ici.",
    loading: "⏳ Génération en cours...",
    emptyAlert: "Écris ou colle un message d’abord.",
    copiedAlert: "Copié !",
    noCopyAlert: "Aucune réponse à copier.",
    error: "Erreur",
    freeLeft: "réponses gratuites restantes",
    paywall: "Limite gratuite atteinte. Passe en PRO pour des réponses illimitées.",
    paywallOutput: "Limite gratuite atteinte. Passe en PRO pour continuer à générer des réponses.",
    tones: [
      ["balanced", "Équilibré"],
      ["friendly", "Amical"],
      ["formal", "Professionnel"],
      ["firm", "Ferme"]
    ],
    lengths: [
      ["short", "Court"],
      ["medium", "Moyen"],
      ["long", "Long"]
    ],
    buttons: {
      delivery: "📦 Retard livraison",
      refund: "💸 Remboursement",
      price: "💰 Négociation prix",
      available: "❓ Toujours dispo ?",
      refuse: "🚫 Refus poli"
    },
    templates: {
      delivery: "Bonjour, je n’ai toujours pas reçu ma commande. Pouvez-vous vérifier la livraison ?",
      refund: "Bonjour, je souhaite un remboursement. Quelle est la procédure ?",
      price: "Bonjour, acceptez-vous un prix plus bas ?",
      available: "Bonjour, cet article est-il toujours disponible ?",
      refuse: "Bonjour, je ne peux pas accepter cette offre, merci."
    }
  }
};

function getLang() {
  return document.getElementById("language").value;
}

function getUsage() {
  return Number(localStorage.getItem("sellerreply_usage") || 0);
}

function setUsage(value) {
  localStorage.setItem("sellerreply_usage", value);
}

function updateSelect(selectId, options) {
  const select = document.getElementById(selectId);
  const currentValue = select.value;

  select.innerHTML = "";

  options.forEach(([value, label]) => {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = label;
    select.appendChild(option);
  });

  if (currentValue) {
    select.value = currentValue;
  }
}

function updateUsageText() {
  const t = uiText[getLang()];
  const usage = getUsage();
  const remaining = Math.max(FREE_LIMIT - usage, 0);
  document.getElementById("usageText").innerText =
    `${remaining} ${t.freeLeft}`;
}

function updateUI() {
  const lang = getLang();
  const t = uiText[lang];

  document.documentElement.lang = lang;

  document.getElementById("headline").innerText = t.headline;
  document.getElementById("subtitle").innerText = t.subtitle;
  document.getElementById("message").placeholder = t.placeholder;
  document.getElementById("generateBtn").innerText = t.generate;
  document.getElementById("copyBtn").innerText = t.copy;
  document.getElementById("proBtn").innerText = t.pro;

  document.getElementById("deliveryBtn").innerText = t.buttons.delivery;
  document.getElementById("refundBtn").innerText = t.buttons.refund;
  document.getElementById("priceBtn").innerText = t.buttons.price;
  document.getElementById("availableBtn").innerText = t.buttons.available;
  document.getElementById("refuseBtn").innerText = t.buttons.refuse;

  updateSelect("tone", t.tones);
  updateSelect("length", t.lengths);
  updateUsageText();

  document.getElementById("paywallBox").innerText = t.paywall;

  const output = document.getElementById("output");
  if (
    output.innerText === uiText.en.outputDefault ||
    output.innerText === uiText.fr.outputDefault ||
    output.innerText === uiText.en.paywallOutput ||
    output.innerText === uiText.fr.paywallOutput
  ) {
    output.innerText = t.outputDefault;
  }
}

function showPaywall() {
  const t = uiText[getLang()];
  document.getElementById("paywallBox").style.display = "block";
  document.getElementById("output").innerText = t.paywallOutput;
}

function setTemplate(type) {
  const lang = getLang();
  document.getElementById("message").value = uiText[lang].templates[type];
}

async function generate() {
  const lang = getLang();
  const t = uiText[lang];

  const message = document.getElementById("message").value.trim();

  if (!message) {
    alert(t.emptyAlert);
    return;
  }

  const usage = getUsage();

  if (usage >= FREE_LIMIT) {
    showPaywall();
    return;
  }

  document.getElementById("output").innerText = t.loading;

  try {
    const res = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message,
        language: lang,
        tone: document.getElementById("tone").value,
        length: document.getElementById("length").value
      })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || "API error");
    }

    setUsage(usage + 1);
    updateUsageText();

    document.getElementById("output").innerText = data.text;

  } catch {
    document.getElementById("output").innerText = t.error;
  }
}

function copyText() {
  const t = uiText[getLang()];
  const text = document.getElementById("output").innerText;

  if (
    !text ||
    text === uiText.en.outputDefault ||
    text === uiText.fr.outputDefault ||
    text === uiText.en.loading ||
    text === uiText.fr.loading ||
    text === uiText.en.paywallOutput ||
    text === uiText.fr.paywallOutput
  ) {
    alert(t.noCopyAlert);
    return;
  }

  navigator.clipboard.writeText(text);
  alert(t.copiedAlert);
}

function unlockPro() {
  window.location.href = STRIPE_PAYMENT_LINK;
}

updateUI();
</script>

</body>
</html>
