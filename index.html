<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>SellerReply AI</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background: #1e293b;
      padding: 25px;
      border-radius: 14px;
      width: 540px;
      box-shadow: 0 0 25px rgba(0,0,0,0.35);
    }

    h1 {
      margin-top: 0;
      font-size: 22px;
    }

    .subtitle {
      font-size: 13px;
      opacity: 0.75;
      margin-bottom: 18px;
    }

    textarea {
      width: 100%;
      height: 120px;
      border-radius: 10px;
      border: none;
      padding: 12px;
      margin-bottom: 15px;
      resize: none;
      font-size: 14px;
    }

    .templates {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }

    .templates button {
      background: #334155;
      border: none;
      padding: 7px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      color: white;
    }

    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    select {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: none;
    }

    .main-btn {
      background: #3b82f6;
      border: none;
      padding: 12px;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }

    .output {
      margin-top: 15px;
      background: #020617;
      padding: 15px;
      border-radius: 10px;
      white-space: pre-line;
      min-height: 70px;
    }

    .copy-btn {
      margin-top: 10px;
      background: #22c55e;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }

    .pro-btn {
      margin-top: 12px;
      background: #f59e0b;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }

    .pro-btn:hover {
      background: #d97706;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Stop wasting hours answering buyers.</h1>

  <div class="subtitle">
    Copy → click → send. Answer any Vinted / Leboncoin message instantly.
  </div>

  <textarea id="message" placeholder="Paste buyer message here..."></textarea>

  <div class="templates">
    <button onclick="setTemplate('delivery')">📦 Delivery delay</button>
    <button onclick="setTemplate('refund')">💸 Refund</button>
    <button onclick="setTemplate('price')">💰 Price negotiation</button>
    <button onclick="setTemplate('available')">❓ Still available?</button>
    <button onclick="setTemplate('refuse')">🚫 Refuse offer</button>
  </div>

  <div class="row">
    <select id="tone">
      <option value="balanced">Balanced</option>
      <option value="friendly">Friendly</option>
      <option value="formal">Professional</option>
      <option value="firm">Firm</option>
    </select>

    <select id="length">
      <option value="short">Short</option>
      <option value="medium">Medium</option>
      <option value="long">Long</option>
    </select>
  </div>

  <button class="main-btn" onclick="generate()">Generate reply</button>

  <div class="output" id="output"></div>

  <button class="copy-btn" onclick="copyText()">Copy reply</button>

  <!-- 🔥 PRO BUTTON -->
  <button class="pro-btn" onclick="unlockPro()">🔥 Unlock PRO</button>

</div>

<script>

function setTemplate(type) {
  const templates = {
    delivery: "Hi, I haven’t received my order yet. Can you check the delivery?",
    refund: "Hi, I would like a refund. What is the process?",
    price: "Hi, would you accept a lower price?",
    available: "Hi, is this item still available?",
    refuse: "Hi, I can’t accept that offer, thank you."
  };

  document.getElementById("message").value = templates[type];
  generate();
}

async function generate() {
  const message = document.getElementById("message").value;
  const tone = document.getElementById("tone").value;
  const length = document.getElementById("length").value;

  if (!message) {
    alert("Write a message first");
    return;
  }

  document.getElementById("output").innerText = "⏳ Generating...";

  try {
    const res = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message,
        language: "en",
        tone,
        length
      })
    });

    const data = await res.json();

    document.getElementById("output").innerText = data.text;

  } catch {
    document.getElementById("output").innerText =
      "Server error.";
  }
}

function copyText() {
  const text = document.getElementById("output").innerText;
  navigator.clipboard.writeText(text);
  alert("Copied!");
}

function unlockPro() {
  alert("Want unlimited replies?\n\nDM me on Instagram: @yourusername");
}

</script>

</body>
</html>
